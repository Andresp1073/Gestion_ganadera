services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1234567890
      MYSQL_DATABASE: RanchMasterDB
    ports:
      - "3306:3306"
      - "5000:8080"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    network_mode: "service:mysql"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
